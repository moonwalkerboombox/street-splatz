name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      # forge-std is installed from GitHub. Fetch it over https so no SSH key is needed.
      - run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      # Foundry (forge, anvil, cast) comes from npm, the same way as on a laptop.
      - run: npm ci --prefix contracts
      # Runs the contract tests, then checks the site's ABI still matches the compiled contract.
      - run: npm run test:contracts

  e2e:
    name: Site build and end to end tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            contracts/package-lock.json
            site/package-lock.json
      - run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - run: npm ci
      - run: npm run setup
      # The same build Cloudflare runs, in preview mode (no contract address).
      - run: npm run build
        env:
          SITE_URL: https://example.com
      - run: npx wrangler deploy --dry-run
      # The browser version comes from the @playwright/test version pinned in site/package.json.
      - run: npx playwright install --with-deps chromium
        working-directory: site
      # Starts anvil, deploys the contract, builds the site against it and drives it in Chromium.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            site/playwright-report/
            site/test-results/
          retention-days: 7
